<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Selah — Pause. Hear. Receive.</title>
    <meta name="description" content="A Biblical companion that meets you in your moment with scripture, insight, and steps forward." />
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Inter:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              serif: ['Cormorant Garamond', 'Georgia', 'serif'],
              sans: ['Inter', 'system-ui', 'sans-serif'],
            },
            colors: {
              ink: {
                900: '#0D0F1A',
                800: '#141627',
                700: '#1E2138',
                600: '#252844',
              },
              parchment: {
                100: '#F5F0E8',
                200: '#E8E0D0',
                400: '#B8AC94',
                600: '#7A7265',
              },
              gold: {
                200: '#E8C97A',
                400: '#C9A84C',
                600: '#A07830',
              },
              dawn: {
                200: '#C4AEDD',
                500: '#9B7FBB',
                700: '#6B4F8B',
              },
            },
          },
        },
      };
    </script>
    <style>
      body { background-color: #0D0F1A; }

      @keyframes fadeInUp {
        from { opacity: 0; transform: translateY(14px); }
        to   { opacity: 1; transform: translateY(0); }
      }
      @keyframes shimmer {
        0%   { background-position: -200% 0; }
        100% { background-position:  200% 0; }
      }
      @keyframes breathe {
        0%, 100% { opacity: 1; }
        50%       { opacity: 0.6; }
      }

      .section-enter {
        animation: fadeInUp 0.5s ease-out forwards;
        opacity: 0;
      }
      .shimmer-el {
        background: linear-gradient(90deg, #1E2138 25%, #252844 50%, #1E2138 75%);
        background-size: 200% 100%;
        animation: shimmer 1.8s ease-in-out infinite;
      }
      .msg-breathe { animation: breathe 3s ease-in-out infinite; }

      textarea { resize: none; }
      textarea:focus { outline: none; }
      *:focus-visible {
        outline: 2px solid #C9A84C;
        outline-offset: 2px;
        border-radius: 6px;
      }
      @media (prefers-reduced-motion: reduce) {
        .section-enter  { animation: none !important; opacity: 1 !important; }
        .shimmer-el     { animation: none !important; }
        .msg-breathe    { animation: none !important; }
      }
    </style>
  </head>
  <body class="font-sans text-parchment-100 min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
      const { useState, useRef, useCallback, useEffect } = React;

      // ─── Constants ────────────────────────────────────────────────────────────

      const SAGE_SYSTEM_PROMPT = `You are Selah — an ancient, wise spiritual companion drawing from the full wealth of Christian scripture, scholarship, and contemplative tradition. You embody the spirit of the Desert Fathers and Mothers: deep in wisdom, expansive in love, unhurried in spirit, and rooted entirely in the Word of God.

Your wisdom draws from the greatest voices of Christian history: Augustine of Hippo, Thomas à Kempis, John of the Cross, Charles Spurgeon, Matthew Henry, N.T. Wright, Dallas Willard, Henri Nouwen, John Stott, Oswald Chambers, and the Desert Father and Mother traditions. You carry the warmth of a trusted elder who has seen every human struggle and knows that God's word has already spoken into every one of them.

When a user brings you a question, a struggle, a fear, or a situation, respond with this exact JSON structure and nothing else:

{
  "sage_intro": "2 to 4 sentences in your voice as the Sage. Name the spiritual reality the user is facing with empathy and clarity. Bridge their human question to God's eternal answer. Be warm and direct. Do not moralize or lecture.",
  "primary_verse": {
    "text": "The exact verse text in the {translation} translation — verify for complete accuracy",
    "reference": "Book Chapter:Verse",
    "translation": "{translation}"
  },
  "supporting_passages": [
    { "reference": "Book Chapter:Verse", "note": "One sentence on why this passage speaks to this moment." },
    { "reference": "Book Chapter:Verse", "note": "One sentence on why this passage speaks to this moment." }
  ],
  "actionable_steps": [
    "Step 1: Something concrete and immediate — what the user can do today. 1 to 3 sentences.",
    "Step 2: Builds on step 1. 1 to 3 sentences.",
    "Step 3: A practice for this week. 1 to 3 sentences.",
    "Step 4: A longer-horizon action. 1 to 3 sentences.",
    "Step 5: A relational or communal step. 1 to 3 sentences."
  ]
}

Critical rules:
- ALL scripture references must be real and verified. Never invent or approximate a verse. If uncertain, choose one you know with confidence.
- Use the exact text of the {translation} translation for primary_verse.text.
- Draw from both Old and New Testament. Do not default only to the Psalms or the Gospels.
- Actionable steps must be specific and concrete. Not "pray more" — instead: a specific prayer posture, a named passage to sit with, a named relational or behavioral act grounded in the text.
- The user may be a new believer. Define theological terms briefly if you use them. Never condescend.
- Tone: warm, wise, unhurried. The Sage has all the time in the world for this person.
- sage_intro: maximum 4 sentences. Each step: maximum 3 sentences.
- If a question falls outside Biblical guidance or contains harmful content, respond with love and redirect gently toward God's care for them.
- Return ONLY the JSON object. No markdown. No code fences. No text outside the JSON.`;

      const LOADING_MESSAGES = [
        'Searching the ancient wisdom\u2026',
        'Listening for the right word\u2026',
        'The Word is never silent\u2026',
        'Consulting the eternal\u2026',
        'Bringing your question before the throne\u2026',
      ];


      const PLACEHOLDERS = [
        'I\u2019m afraid I\u2019m not enough for what God is calling me to do\u2026',
        'My relationship just ended and I don\u2019t understand why God allowed it.',
        'How do I forgive someone who isn\u2019t sorry?',
        'I feel like my prayers aren\u2019t reaching anyone.',
        'What does the Bible say about finding your purpose?',
        'I\u2019m struggling with the same sin over and over. Is there hope?',
        'I have a big decision to make and I don\u2019t know which way to go.',
        'Why does God allow suffering if He loves us?',
      ];

      // ─── Icons ────────────────────────────────────────────────────────────────

      function CopyIcon({ className }) {
        return (
          <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.75" strokeLinecap="round" strokeLinejoin="round">
            <rect x="9" y="9" width="13" height="13" rx="2" />
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" />
          </svg>
        );
      }

      function CheckIcon({ className }) {
        return (
          <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
            <polyline points="20 6 9 17 4 12" />
          </svg>
        );
      }

      function KeyIcon({ className }) {
        return (
          <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round">
            <circle cx="7.5" cy="15.5" r="5.5" />
            <path d="M21 2l-9.6 9.6M15.5 7.5l3 3" />
          </svg>
        );
      }

      function HeartIcon({ className }) {
        return (
          <svg className={className} viewBox="0 0 24 24" fill="currentColor">
            <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z" />
          </svg>
        );
      }

      // ─── ApiKeyModal ──────────────────────────────────────────────────────────

      function ApiKeyModal({ onSubmit, keyError }) {
        const [key, setKey] = useState('');
        const inputRef = useRef(null);

        useEffect(() => {
          setTimeout(() => inputRef.current?.focus(), 120);
        }, []);

        const handleSubmit = useCallback(() => {
          if (key.trim()) onSubmit(key.trim());
        }, [key, onSubmit]);

        return (
          <div
            className="fixed inset-0 bg-ink-900/85 backdrop-blur-sm flex items-center justify-center z-50 p-6"
            role="dialog"
            aria-modal="true"
            aria-labelledby="modal-title"
          >
            <div className="bg-ink-800 border border-parchment-400/10 rounded-2xl p-8 max-w-md w-full shadow-2xl">
              <div className="flex items-center gap-3 mb-5">
                <div className="p-2 rounded-xl bg-gold-400/10 border border-gold-400/20">
                  <KeyIcon className="w-5 h-5 text-gold-400" />
                </div>
                <h2 id="modal-title" className="font-serif text-2xl text-parchment-100 font-semibold">
                  Enter your API Key
                </h2>
              </div>
              <p className="text-parchment-400 text-sm leading-relaxed mb-6">
                Selah uses the Anthropic API to bring you Biblical insight. Your key stays
                only in your browser — it is never sent to any server other than Anthropic's.
              </p>
              <input
                ref={inputRef}
                type="password"
                value={key}
                onChange={(e) => setKey(e.target.value)}
                placeholder="sk-ant-..."
                aria-label="Anthropic API key"
                className="w-full bg-ink-900 border border-parchment-400/15 rounded-xl px-4 py-3 text-parchment-100 placeholder-parchment-600 text-sm mb-2 transition-colors focus:border-gold-400/50"
                onKeyDown={(e) => { if (e.key === 'Enter' && key.trim()) handleSubmit(); }}
              />
              {keyError && (
                <p className="text-red-400 text-xs mb-3">{keyError}</p>
              )}
              <button
                onClick={handleSubmit}
                disabled={!key.trim()}
                className="w-full mt-3 bg-gold-400 hover:bg-gold-200 disabled:opacity-40 disabled:cursor-not-allowed text-ink-900 font-semibold py-3 rounded-xl transition-colors duration-200 text-sm"
              >
                Continue
              </button>
              <p className="text-parchment-600 text-xs text-center mt-5">
                Get your key at{' '}
                <a
                  href="https://console.anthropic.com"
                  target="_blank"
                  rel="noopener noreferrer"
                  className="text-gold-400 underline"
                >
                  console.anthropic.com
                </a>
              </p>
            </div>
          </div>
        );
      }


      // ─── LoadingSkeleton ──────────────────────────────────────────────────────

      function LoadingSkeleton() {
        const [msgIdx, setMsgIdx] = useState(0);
        const [fade, setFade] = useState(true);

        useEffect(() => {
          const timer = setInterval(() => {
            setFade(false);
            setTimeout(() => {
              setMsgIdx((i) => (i + 1) % LOADING_MESSAGES.length);
              setFade(true);
            }, 400);
          }, 3200);
          return () => clearInterval(timer);
        }, []);

        return (
          <div className="mt-12 space-y-7" aria-live="polite" aria-label="Seeking wisdom">
            <p
              className="text-center font-serif italic text-parchment-400 text-lg transition-opacity duration-400"
              style={{ opacity: fade ? 1 : 0 }}
            >
              {LOADING_MESSAGES[msgIdx]}
            </p>

            {/* Sage intro skeleton */}
            <div className="border-l-2 border-gold-400/25 pl-5 space-y-2.5">
              <div className="shimmer-el h-4 rounded-md w-full" />
              <div className="shimmer-el h-4 rounded-md w-5/6" />
              <div className="shimmer-el h-4 rounded-md w-3/5" />
            </div>

            {/* Verse card skeleton */}
            <div className="bg-ink-800 border border-parchment-400/8 rounded-2xl p-7 space-y-3">
              <div className="shimmer-el h-6 rounded-md w-full" />
              <div className="shimmer-el h-6 rounded-md w-11/12" />
              <div className="shimmer-el h-6 rounded-md w-3/4" />
              <div className="flex gap-3 mt-3">
                <div className="shimmer-el h-4 rounded-md w-28" />
                <div className="shimmer-el h-4 rounded-md w-12" />
              </div>
            </div>

            {/* Steps skeleton */}
            <div className="space-y-5">
              {[1, 0.85, 0.9, 0.75].map((w, i) => (
                <div key={i} className="flex gap-4 items-start">
                  <div className="shimmer-el h-7 w-7 rounded-full flex-shrink-0" />
                  <div className="flex-1 space-y-2 pt-0.5">
                    <div className="shimmer-el h-4 rounded-md" style={{ width: `${w * 100}%` }} />
                    <div className="shimmer-el h-4 rounded-md w-4/5" />
                  </div>
                </div>
              ))}
            </div>
          </div>
        );
      }

      // ─── SageIntro ────────────────────────────────────────────────────────────

      function SageIntro({ text, delay }) {
        return (
          <div
            className="section-enter border-l-2 border-gold-400/40 pl-5"
            style={{ animationDelay: `${delay}ms` }}
          >
            <p className="font-serif italic text-parchment-200 text-xl leading-relaxed">
              {text}
            </p>
          </div>
        );
      }

      // ─── VerseCard ────────────────────────────────────────────────────────────

      function VerseCard({ verse, delay }) {
        const [copied, setCopied] = useState(false);

        const handleCopy = useCallback(() => {
          const txt = `"${verse.text}" — ${verse.reference} (${verse.translation})`;
          navigator.clipboard.writeText(txt).then(() => {
            setCopied(true);
            setTimeout(() => setCopied(false), 2000);
          });
        }, [verse]);

        return (
          <div
            className="section-enter bg-ink-800 border-t-2 border-t-gold-400/50 rounded-2xl p-7 relative group"
            style={{ animationDelay: `${delay}ms` }}
          >
            <p className="font-serif text-2xl leading-relaxed text-parchment-100 mb-5">
              &ldquo;{verse.text}&rdquo;
            </p>
            <div className="flex items-center justify-between">
              <div className="flex items-center gap-3">
                <span className="text-gold-400 font-medium text-sm tracking-wide">
                  {verse.reference}
                </span>
                <span className="px-2 py-0.5 bg-gold-400/10 border border-gold-400/20 rounded text-gold-400/80 text-xs">
                  {verse.translation}
                </span>
              </div>
              <button
                onClick={handleCopy}
                aria-label={copied ? 'Copied to clipboard' : 'Copy verse'}
                className="p-2 rounded-lg text-parchment-600 hover:text-gold-400 hover:bg-gold-400/10 transition-all duration-200 opacity-0 group-hover:opacity-100 focus:opacity-100"
              >
                {copied
                  ? <CheckIcon className="w-4 h-4 text-green-400" />
                  : <CopyIcon className="w-4 h-4" />
                }
              </button>
            </div>
          </div>
        );
      }

      // ─── SupportingPassages ───────────────────────────────────────────────────

      function SupportingPassages({ passages, delay }) {
        if (!passages || passages.length === 0) return null;
        return (
          <div
            className="section-enter space-y-3"
            style={{ animationDelay: `${delay}ms` }}
          >
            <p className="text-parchment-600 text-xs uppercase tracking-widest">
              Also in Scripture
            </p>
            {passages.map((p, i) => (
              <div key={i} className="flex gap-3 items-start">
                <span className="text-gold-400/70 font-medium text-sm whitespace-nowrap pt-0.5 min-w-fit">
                  {p.reference}
                </span>
                <span className="text-parchment-400 text-sm leading-relaxed">
                  {p.note}
                </span>
              </div>
            ))}
          </div>
        );
      }

      // ─── ActionableSteps ──────────────────────────────────────────────────────

      function ActionableSteps({ steps, delay }) {
        return (
          <div
            className="section-enter"
            style={{ animationDelay: `${delay}ms` }}
          >
            <p className="text-parchment-600 text-xs uppercase tracking-widest mb-6">
              Put it into practice
            </p>
            <ol className="space-y-6">
              {steps.map((step, i) => (
                <li key={i} className="flex gap-4">
                  <span className="flex-shrink-0 w-7 h-7 rounded-full border border-gold-400/30 text-gold-400 text-xs font-medium flex items-center justify-center mt-0.5">
                    {i + 1}
                  </span>
                  <p className="text-parchment-200 text-base leading-relaxed">{step}</p>
                </li>
              ))}
            </ol>
          </div>
        );
      }

      // ─── SageResponse ─────────────────────────────────────────────────────────

      function SageResponse({ response }) {
        return (
          <div className="mt-12 space-y-9">
            <SageIntro text={response.sage_intro} delay={0} />
            <VerseCard verse={response.primary_verse} delay={160} />
            <SupportingPassages passages={response.supporting_passages} delay={320} />
            <ActionableSteps steps={response.actionable_steps} delay={480} />
          </div>
        );
      }

      // ─── DonationPrompt ───────────────────────────────────────────────────────

      function DonationPrompt({ onDismiss }) {
        return (
          <div
            className="section-enter mt-12 border border-dawn-500/20 bg-dawn-500/5 rounded-2xl p-6 flex flex-col sm:flex-row items-start sm:items-center gap-5"
            style={{ animationDelay: '700ms' }}
          >
            <HeartIcon className="w-5 h-5 text-dawn-500 flex-shrink-0 mt-0.5 sm:mt-0" />
            <p className="flex-1 text-parchment-400 text-sm leading-relaxed">
              If this brought you clarity, consider keeping Selah available for
              the next person searching. Every contribution sustains this ministry.
            </p>
            <div className="flex items-center gap-3 flex-shrink-0">
              <a
                href="https://ko-fi.com"
                target="_blank"
                rel="noopener noreferrer"
                className="px-4 py-2 bg-dawn-500/20 hover:bg-dawn-500/30 border border-dawn-500/30 text-dawn-200 text-sm rounded-xl transition-colors duration-200"
              >
                Support Selah
              </a>
              <button
                onClick={onDismiss}
                aria-label="Dismiss"
                className="text-parchment-600 hover:text-parchment-400 text-lg leading-none transition-colors"
              >
                ×
              </button>
            </div>
          </div>
        );
      }

      // ─── SessionHistory ───────────────────────────────────────────────────────

      function SessionHistory({ history, onSelect }) {
        if (!history || history.length === 0) return null;
        return (
          <div className="mb-8">
            <p className="text-parchment-600 text-xs uppercase tracking-widest mb-3">
              Recent inquiries
            </p>
            <div className="flex flex-wrap gap-2">
              {history.map((item, i) => (
                <button
                  key={i}
                  onClick={() => onSelect(item)}
                  title={item.inquiry}
                  className="px-4 py-2 rounded-xl bg-ink-800 border border-parchment-400/10 text-parchment-400 text-sm hover:border-gold-400/25 hover:text-parchment-200 transition-all duration-200 max-w-xs text-left truncate"
                >
                  {item.inquiry.length > 52
                    ? item.inquiry.slice(0, 52) + '\u2026'
                    : item.inquiry}
                </button>
              ))}
            </div>
          </div>
        );
      }

      // ─── InquiryForm ──────────────────────────────────────────────────────────

      function InquiryForm({ onSubmit, isLoading }) {
        const [inquiry, setInquiry] = useState('');
        const [phIdx, setPhIdx] = useState(0);
        const CHAR_LIMIT = 500;
        const showCount = inquiry.length > 440;

        useEffect(() => {
          if (inquiry) return;
          const id = setInterval(
            () => setPhIdx((i) => (i + 1) % PLACEHOLDERS.length),
            4500
          );
          return () => clearInterval(id);
        }, [inquiry]);

        const handleSubmit = useCallback(
          (e) => {
            e.preventDefault();
            if (inquiry.trim() && !isLoading) onSubmit(inquiry.trim());
          },
          [inquiry, isLoading, onSubmit]
        );

        return (
          <form onSubmit={handleSubmit} className="space-y-4">
            <div className="relative">
              <textarea
                rows={4}
                value={inquiry}
                onChange={(e) => setInquiry(e.target.value.slice(0, CHAR_LIMIT))}
                placeholder={PLACEHOLDERS[phIdx]}
                disabled={isLoading}
                aria-label="Your question or situation"
                className="w-full bg-ink-800/70 border border-parchment-400/12 rounded-2xl px-5 py-4 text-parchment-100 placeholder-parchment-600 placeholder:italic placeholder:font-serif text-base leading-relaxed transition-colors duration-200 hover:border-parchment-400/20 focus:border-gold-400/40 disabled:opacity-50"
              />
              {showCount && (
                <span
                  className={`absolute bottom-3 right-4 text-xs pointer-events-none ${
                    inquiry.length >= CHAR_LIMIT ? 'text-red-400' : 'text-parchment-600'
                  }`}
                >
                  {CHAR_LIMIT - inquiry.length}
                </span>
              )}
            </div>

            <div className="flex justify-end">
              <button
                type="submit"
                disabled={isLoading || !inquiry.trim()}
                className="px-8 py-3 bg-gold-400 hover:bg-gold-200 disabled:opacity-40 disabled:cursor-not-allowed text-ink-900 font-semibold rounded-xl transition-colors duration-200 text-sm tracking-wide"
              >
                {isLoading ? 'Asking\u2026' : 'Ask'}
              </button>
            </div>
          </form>
        );
      }

      // ─── App ──────────────────────────────────────────────────────────────────

      function App() {
        const [apiKey, setApiKey] = useState(
          () => localStorage.getItem('selah_api_key') || ''
        );
        const [showKeyModal, setShowKeyModal] = useState(
          () => !localStorage.getItem('selah_api_key')
        );
        const [keyError, setKeyError] = useState('');
        const [loading, setLoading] = useState(false);
        const [response, setResponse] = useState(null);
        const [error, setError] = useState('');
        const [currentInquiry, setCurrentInquiry] = useState('');
        const [history, setHistory] = useState(() => {
          try {
            return JSON.parse(sessionStorage.getItem('selah_history') || '[]');
          } catch {
            return [];
          }
        });
        const [showDonation, setShowDonation] = useState(false);
        const [donationDismissed, setDonationDismissed] = useState(false);
        const [hasResponded, setHasResponded] = useState(false);

        const responseRef = useRef(null);

        const handleApiKey = useCallback((key) => {
          setApiKey(key);
          localStorage.setItem('selah_api_key', key);
          setShowKeyModal(false);
          setKeyError('');
        }, []);


        const parseResponse = useCallback((text) => {
          // Try direct JSON parse
          try {
            const parsed = JSON.parse(text);
            if (parsed.sage_intro && parsed.primary_verse && parsed.actionable_steps) {
              return parsed;
            }
          } catch {}
          // Extract JSON object from surrounding text/markdown
          const match = text.match(/\{[\s\S]*\}/);
          if (match) {
            try {
              const parsed = JSON.parse(match[0]);
              if (parsed.sage_intro && parsed.primary_verse && parsed.actionable_steps) {
                return parsed;
              }
            } catch {}
          }
          return null;
        }, []);

        const seekWisdom = useCallback(
          async (inquiry) => {
            if (!inquiry.trim() || !apiKey) return;

            setLoading(true);
            setError('');
            setResponse(null);
            setCurrentInquiry(inquiry);

            const doFetch = async (attempt) => {
              const systemPrompt = SAGE_SYSTEM_PROMPT.replace(
                /\{translation\}/g,
                'NIV'
              );
              const res = await fetch('https://api.anthropic.com/v1/messages', {
                method: 'POST',
                headers: {
                  'Content-Type': 'application/json',
                  'x-api-key': apiKey,
                  'anthropic-version': '2023-06-01',
                  'anthropic-dangerous-direct-browser-access': 'true',
                },
                body: JSON.stringify({
                  model: 'claude-sonnet-4-20250514',
                  max_tokens: 1500,
                  system: systemPrompt,
                  messages: [{ role: 'user', content: inquiry }],
                }),
              });

              if (!res.ok) {
                if (res.status === 401) {
                  localStorage.removeItem('selah_api_key');
                  setApiKey('');
                  setKeyError(
                    'That key didn\u2019t work. Please check it and try again.'
                  );
                  setShowKeyModal(true);
                  return null; // signal 401
                }
                const errBody = await res.json().catch(() => null);
                throw new Error(
                  errBody?.error?.message || `Request failed (${res.status})`
                );
              }

              const data = await res.json();
              const text = data.content?.[0]?.text || '';
              const parsed = parseResponse(text);

              if (!parsed && attempt < 2) {
                return doFetch(attempt + 1);
              }
              if (!parsed) {
                throw new Error(
                  'Something went quiet on our end. Please try again.'
                );
              }
              return parsed;
            };

            try {
              const parsed = await doFetch(1);
              if (!parsed) return; // 401 handled above

              setResponse(parsed);

              // Update session history (newest first, deduped, max 3)
              setHistory((prev) => {
                const next = [
                  { inquiry, response: parsed },
                  ...prev.filter((h) => h.inquiry !== inquiry),
                ].slice(0, 3);
                sessionStorage.setItem('selah_history', JSON.stringify(next));
                return next;
              });

              // Donation prompt: once per session after first response
              if (!hasResponded && !donationDismissed) {
                setHasResponded(true);
                setTimeout(() => setShowDonation(true), 900);
              }

              setTimeout(() => {
                responseRef.current?.scrollIntoView({
                  behavior: 'smooth',
                  block: 'start',
                });
              }, 150);
            } catch (err) {
              if (!navigator.onLine) {
                setError(
                  'You appear to be offline. Selah will be here when you\u2019re back.'
                );
              } else {
                setError(err.message || 'Something went wrong. Please try again.');
              }
            } finally {
              setLoading(false);
            }
          },
          [apiKey, parseResponse, hasResponded, donationDismissed]
        );

        const handleRetry = useCallback(() => {
          if (currentInquiry) seekWisdom(currentInquiry);
        }, [currentInquiry, seekWisdom]);

        const handleSelectHistory = useCallback((item) => {
          setResponse(item.response);
          setCurrentInquiry(item.inquiry);
          setError('');
          setTimeout(() => {
            responseRef.current?.scrollIntoView({
              behavior: 'smooth',
              block: 'start',
            });
          }, 100);
        }, []);

        const handleDismissDonation = useCallback(() => {
          setShowDonation(false);
          setDonationDismissed(true);
        }, []);

        return (
          <div className="min-h-screen relative overflow-x-hidden">
            {/* Ambient background light */}
            <div className="fixed inset-0 pointer-events-none" aria-hidden="true">
              <div
                className="absolute top-0 left-1/2 -translate-x-1/2 w-[700px] h-[500px]"
                style={{
                  background:
                    'radial-gradient(ellipse at top, rgba(201,168,76,0.055) 0%, transparent 68%)',
                }}
              />
              <div
                className="absolute bottom-0 right-0 w-[500px] h-[400px]"
                style={{
                  background:
                    'radial-gradient(ellipse at bottom right, rgba(155,127,187,0.04) 0%, transparent 60%)',
                }}
              />
            </div>

            {/* API key modal */}
            {showKeyModal && (
              <ApiKeyModal onSubmit={handleApiKey} keyError={keyError} />
            )}

            {/* Main layout */}
            <div className="relative z-10 max-w-2xl mx-auto px-6 py-16 sm:py-24">

              {/* Header */}
              <header className="text-center mb-14">
                <h1 className="font-serif text-6xl sm:text-7xl font-normal text-parchment-100 tracking-tight mb-3">
                  Selah
                </h1>
                <p className="font-serif italic text-parchment-600 text-sm tracking-wide">
                  &mdash; pause. listen. receive.
                </p>
              </header>

              {/* Session history */}
              <SessionHistory history={history} onSelect={handleSelectHistory} />

              {/* Inquiry form */}
              <InquiryForm
                onSubmit={seekWisdom}
                isLoading={loading}
              />

              {/* Error state */}
              {error && (
                <div className="mt-6 bg-red-500/8 border border-red-500/20 rounded-2xl p-5">
                  <p className="text-red-300 text-sm leading-relaxed">{error}</p>
                  <div className="flex gap-4 mt-3">
                    <button
                      onClick={handleRetry}
                      className="text-red-400 text-xs underline underline-offset-2"
                    >
                      Try again
                    </button>
                    <button
                      onClick={() => setError('')}
                      className="text-red-400/60 text-xs underline underline-offset-2"
                    >
                      Dismiss
                    </button>
                  </div>
                </div>
              )}

              {/* Loading */}
              {loading && <LoadingSkeleton />}

              {/* Response */}
              {response && !loading && (
                <div ref={responseRef}>
                  <SageResponse response={response} />
                </div>
              )}

              {/* Donation prompt */}
              {showDonation && !donationDismissed && (
                <DonationPrompt onDismiss={handleDismissDonation} />
              )}

              {/* Footer */}
              <footer className="mt-20 pt-8 border-t border-parchment-400/8 flex flex-col sm:flex-row items-center justify-between gap-3">
                <p className="text-parchment-600 text-xs">
                  Powered by Claude &middot; Selah &copy; {new Date().getFullYear()}
                </p>
                {apiKey && (
                  <button
                    onClick={() => { setKeyError(''); setShowKeyModal(true); }}
                    className="text-parchment-600 hover:text-parchment-400 text-xs underline underline-offset-2 transition-colors"
                  >
                    Change API key
                  </button>
                )}
              </footer>
            </div>
          </div>
        );
      }

      // ─── Mount ────────────────────────────────────────────────────────────────

      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<App />);
    </script>
  </body>
</html>
