<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Design Thinking — Daily Blog</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400;1,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ─── TOP BAR ─── -->
  <header class="top-bar">
    <button class="hamburger-btn" id="hamburgerBtn" aria-label="Toggle navigation">
      <svg id="hamburgerIcon" viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg">
        <line x1="2" y1="4.5" x2="16" y2="4.5"/>
        <line x1="2" y1="9"   x2="16" y2="9"/>
        <line x1="2" y1="13.5" x2="16" y2="13.5"/>
      </svg>
    </button>

    <span class="top-bar-title">Design Thinking</span>

    <button class="theme-toggle" id="themeToggle" aria-label="Toggle color mode">
      <span class="theme-toggle-icon" id="themeIcon">
        <svg id="iconSun" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <circle cx="12" cy="12" r="4"/>
          <line x1="12" y1="2"  x2="12" y2="5"/>
          <line x1="12" y1="19" x2="12" y2="22"/>
          <line x1="2"  y1="12" x2="5"  y2="12"/>
          <line x1="19" y1="12" x2="22" y2="12"/>
          <line x1="4.22"  y1="4.22"  x2="6.34"  y2="6.34"/>
          <line x1="17.66" y1="17.66" x2="19.78" y2="19.78"/>
          <line x1="19.78" y1="4.22"  x2="17.66" y2="6.34"/>
          <line x1="6.34"  y1="17.66" x2="4.22"  y2="19.78"/>
        </svg>
        <svg id="iconMoon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" style="display:none">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
      </span>
      <span class="theme-toggle-label" id="themeLabel">Light</span>
    </button>
  </header>

  <!-- ─── SIDEBAR BACKDROP ─── -->
  <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

  <!-- ─── SIDEBAR ─── -->
  <nav class="sidebar" id="sidebar" aria-label="Blog entries">
    <div class="sidebar-inner">
      <div class="sidebar-blog-title">Design Thinking</div>
      <div id="sidebarNav"></div>
    </div>
  </nav>

  <!-- ─── LAYOUT ─── -->
  <div class="layout">
    <main class="main-content" id="mainContent" role="main">
      <div class="loading-state">Loading&hellip;</div>
    </main>
  </div>

  <script>
    // ═══════════════════════════════════════════════════════════════
    // DATA — fetched from manifest.json and individual entry files
    // ═══════════════════════════════════════════════════════════════

    let MANIFEST = [];                 // [{date, type, title, month?}]
    const ENTRY_CACHE = new Map();     // date → full entry object

    async function fetchManifest() {
      const res = await fetch('./manifest.json');
      if (!res.ok) throw new Error(`Failed to load manifest (${res.status})`);
      MANIFEST = await res.json();
    }

    async function fetchEntry(date) {
      if (ENTRY_CACHE.has(date)) return ENTRY_CACHE.get(date);
      const [y, m] = date.split('-');
      const res = await fetch(`./entries/${y}-${m}/${date}.json`);
      if (!res.ok) throw new Error(`Failed to load entry ${date} (${res.status})`);
      const data = await res.json();
      ENTRY_CACHE.set(date, data);
      return data;
    }

    // ═══════════════════════════════════════════════════════════════
    // HELPERS
    // ═══════════════════════════════════════════════════════════════

    function formatDate(dateStr) {
      const [y, m, d] = dateStr.split('-').map(Number);
      const date = new Date(y, m - 1, d);
      return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
    }

    function formatDateLong(dateStr) {
      const [y, m, d] = dateStr.split('-').map(Number);
      const date = new Date(y, m - 1, d);
      return date.toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });
    }

    function getMonthKey(dateStr) {
      const [y, m] = dateStr.split('-');
      return `${y}-${m}`;
    }

    function formatMonthLabel(monthKey) {
      const [y, m] = monthKey.split('-').map(Number);
      const date = new Date(y, m - 1, 1);
      return date.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
    }

    function truncateTitle(title, maxLen = 28) {
      if (title.length <= maxLen) return title;
      return title.slice(0, maxLen).trim() + '\u2026';
    }

    // ═══════════════════════════════════════════════════════════════
    // VISUAL BUILDERS
    // ═══════════════════════════════════════════════════════════════

    function buildRingsVisual() {
      return `<div class="visual-rings">
        <div class="ring ring-4"></div>
        <div class="ring ring-3"></div>
        <div class="ring ring-2"></div>
        <div class="ring ring-1"></div>
        <div class="ring-dot"></div>
      </div>`;
    }

    function buildClarityVisual() {
      return `<div class="visual-clarity">
        <span class="clarity-label clarity-top">Ambiguous</span>
        <div class="clarity-beam"></div>
        <span class="clarity-label clarity-bottom">Clear</span>
      </div>`;
    }

    function buildFrameVisual() {
      return `<div class="visual-frame-wrap">
        <svg class="frame-svg" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
          <rect class="frame-outer" x="8"  y="8"  width="184" height="184" rx="2"/>
          <rect class="frame-inner" x="32" y="32" width="136" height="136" rx="1"/>
          <line class="frame-cross-h" x1="8" y1="100" x2="192" y2="100"/>
          <line class="frame-cross-v" x1="100" y1="8" x2="100" y2="192"/>
          <circle class="frame-center" cx="100" cy="100" r="3"/>
        </svg>
      </div>`;
    }

    function buildVisual(type) {
      if (type === 'rings')   return buildRingsVisual();
      if (type === 'clarity') return buildClarityVisual();
      if (type === 'frame')   return buildFrameVisual();
      return '';
    }

    // ═══════════════════════════════════════════════════════════════
    // RENDER ENTRY
    // ═══════════════════════════════════════════════════════════════

    let currentRevealObserver = null;

    function renderEntry(entry, isFirstLoad) {
      if (entry.type === 'summary') {
        renderSummary(entry);
        return;
      }

      const main = document.getElementById('mainContent');
      const entryIndex = MANIFEST.findIndex(e => e.date === entry.date);
      const prevMeta = entryIndex > 0 ? MANIFEST[entryIndex - 1] : null;
      const nextMeta = entryIndex < MANIFEST.length - 1 ? MANIFEST[entryIndex + 1] : null;

      const principleCount = entry.principles.length;

      const principlesHTML = entry.principles.map((p, i) => {
        const isEven = i % 2 === 1;
        const contentHTML = `<div class="principle-content">
          <div class="principle-label">
            <span class="principle-num">${p.number}</span>
            <div class="principle-label-line"></div>
          </div>
          <h2 class="principle-headline">${p.headline}</h2>
          ${p.body.map(para => `<p class="principle-body">${para}</p>`).join('\n')}
          <blockquote class="principle-callout">${p.callout}</blockquote>
        </div>`;

        const visualHTML = `<div class="principle-visual">${buildVisual(p.visual)}</div>`;

        return `<article class="principle" data-index="${i + 1}" data-visual="${p.visual}">
          ${isEven ? visualHTML : contentHTML}
          ${isEven ? contentHTML : visualHTML}
        </article>`;
      }).join('\n');

      const actionsHTML = entry.actions.map((a, i) => `<div class="action-item">
        <div class="action-meta">
          <span class="action-num">${String(i + 1).padStart(2, '0')}</span>
          <span class="action-tag">${a.tag}</span>
        </div>
        <div class="action-title">${a.title}</div>
        <p class="action-desc">${a.desc}</p>
        <p class="action-example">${a.example}</p>
      </div>`).join('\n');

      const prevHTML = prevMeta
        ? `<button class="entry-nav-side left" onclick="navigateTo('${prevMeta.date}')">
            <span class="entry-nav-arrow">
              <svg viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
                <polyline points="12,4 6,10 12,16"/>
                <line x1="6" y1="10" x2="18" y2="10"/>
              </svg>
            </span>
            <div class="entry-nav-meta">
              <span class="entry-nav-date">${formatDate(prevMeta.date)}</span>
              <span class="entry-nav-title">${truncateTitle(prevMeta.title)}</span>
            </div>
          </button>`
        : `<div class="entry-nav-side left hidden" aria-hidden="true"></div>`;

      const nextHTML = nextMeta
        ? `<button class="entry-nav-side right" onclick="navigateTo('${nextMeta.date}')">
            <div class="entry-nav-meta">
              <span class="entry-nav-date">${formatDate(nextMeta.date)}</span>
              <span class="entry-nav-title">${truncateTitle(nextMeta.title)}</span>
            </div>
            <span class="entry-nav-arrow">
              <svg viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
                <polyline points="8,4 14,10 8,16"/>
                <line x1="2" y1="10" x2="14" y2="10"/>
              </svg>
            </span>
          </button>`
        : `<div class="entry-nav-side right disabled" aria-hidden="true">
            <div class="entry-nav-meta">
              <span class="entry-nav-date" style="opacity:0.35">Up to date</span>
            </div>
          </div>`;

      const heroClass = isFirstLoad ? 'hero' : 'hero compact';

      main.innerHTML = `
        <section class="${heroClass}">
          <div class="hero-eyebrow">${entry.theme}</div>
          <div class="hero-date">${formatDateLong(entry.date)}</div>
          <h1 class="hero-headline">${entry.title}</h1>
          <p class="hero-body">${entry.subtitle}</p>
          ${isFirstLoad ? `<div class="hero-scroll-hint">
            <div class="scroll-line"></div>
            <span class="scroll-label">Continue</span>
          </div>` : ''}
          <div class="hero-ghost" aria-hidden="true">${principleCount}</div>
        </section>

        <div class="principles">
          ${principlesHTML}
        </div>

        <section class="coda">
          <div class="coda-eyebrow">${entry.coda.eyebrow}</div>
          <p class="coda-quote">${entry.coda.quote}</p>
          <div class="coda-divider">
            <div class="coda-divider-line"></div>
            <div class="coda-divider-dot"></div>
            <div class="coda-divider-line"></div>
          </div>
          <p class="coda-footer">${entry.coda.footer}</p>
        </section>

        <section class="actions">
          <div class="actions-header">
            <span class="actions-eyebrow">Put it to work</span>
            <h2 class="actions-headline">Daily practices for the<br><em>thinking designer</em>.</h2>
          </div>
          <div class="actions-grid">
            ${actionsHTML}
          </div>
        </section>

        <section class="closing-quote">
          <div class="closing-quote-mark">&ldquo;</div>
          <p class="closing-quote-text">${entry.closingQuote.text}</p>
          <div class="closing-quote-rule"></div>
          <div class="closing-quote-attribution">${entry.closingQuote.attribution}</div>
          <div class="closing-quote-role">${entry.closingQuote.role}</div>
        </section>

        <nav class="entry-nav" aria-label="Entry navigation">
          ${prevHTML}
          <div class="entry-nav-divider"></div>
          ${nextHTML}
        </nav>
      `;

      document.title = `${entry.title} \u2014 Design Thinking`;
      setupScrollReveal();
      updateSidebarActive(entry.date);
    }

    // ═══════════════════════════════════════════════════════════════
    // SCROLL REVEAL
    // ═══════════════════════════════════════════════════════════════

    function setupScrollReveal() {
      if (currentRevealObserver) {
        currentRevealObserver.disconnect();
      }

      currentRevealObserver = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (!entry.isIntersecting) return;

          const el = entry.target;
          el.classList.add('visible');

          const clarityVisual = el.querySelector('.visual-clarity');
          if (clarityVisual) {
            setTimeout(() => {
              clarityVisual.querySelector('.clarity-beam')?.classList.add('extended');
              clarityVisual.querySelector('.clarity-top')?.classList.add('sharpened');
              clarityVisual.querySelector('.clarity-bottom')?.classList.add('sharpened');
            }, 200);
          }

          const frameWrap = el.querySelector('.visual-frame-wrap');
          if (frameWrap) {
            setTimeout(() => {
              frameWrap.classList.add('frame-drawn');
            }, 200);
          }

          currentRevealObserver.unobserve(el);
        });
      }, { threshold: 0.2 });

      document.querySelectorAll('.principle, .coda, .actions, .closing-quote').forEach(el => {
        currentRevealObserver.observe(el);
      });
    }

    // ═══════════════════════════════════════════════════════════════
    // SIDEBAR BUILDER
    // ═══════════════════════════════════════════════════════════════

    let isFirstRender = true;

    function buildSidebar() {
      const nav = document.getElementById('sidebarNav');

      const months = {};
      [...MANIFEST].reverse().forEach(entry => {
        const key = getMonthKey(entry.date);
        if (!months[key]) months[key] = [];
        months[key].push(entry);
      });

      let html = '';
      Object.entries(months).forEach(([monthKey, monthEntries]) => {
        html += `
          <div class="sidebar-month" data-month="${monthKey}" id="month-${monthKey}">
            <div class="sidebar-month-header" onclick="toggleMonth('${monthKey}')">
              <span class="sidebar-month-label">${formatMonthLabel(monthKey)}</span>
              <span class="sidebar-month-chevron">
                <svg viewBox="0 0 12 12" xmlns="http://www.w3.org/2000/svg">
                  <polyline points="2,4 6,8 10,4"/>
                </svg>
              </span>
            </div>
            <div class="sidebar-entries">
              ${monthEntries.map(entry => `
                <button class="sidebar-entry${entry.type === 'summary' ? ' sidebar-entry--summary' : ''}" data-date="${entry.date}" onclick="navigateTo('${entry.date}')">
                  <div class="sidebar-entry-date">${entry.type === 'summary' ? '\u2014 ' + entry.month + ' Summary' : formatDate(entry.date)}</div>
                  <div class="sidebar-entry-title">${entry.type === 'summary' ? 'Monthly Review' : truncateTitle(entry.title, 26)}</div>
                </button>
              `).join('')}
            </div>
          </div>
        `;
      });

      nav.innerHTML = html;
    }

    function toggleMonth(monthKey) {
      const monthEl = document.getElementById(`month-${monthKey}`);
      if (monthEl) {
        monthEl.classList.toggle('open');
      }
    }

    function updateSidebarActive(activeDate) {
      document.querySelectorAll('.sidebar-entry').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.date === activeDate);
      });

      const monthKey = getMonthKey(activeDate);
      const monthEl = document.getElementById(`month-${monthKey}`);
      if (monthEl && !monthEl.classList.contains('open')) {
        monthEl.classList.add('open');
      }
    }

    // ═══════════════════════════════════════════════════════════════
    // HASH ROUTING
    // ═══════════════════════════════════════════════════════════════

    async function getEntryFromHash() {
      const hash = window.location.hash.replace('#', '');
      if (hash) {
        const found = MANIFEST.find(e => e.date === hash);
        if (found) return await fetchEntry(hash);
      }
      // Default: most recent entry
      const latest = MANIFEST[MANIFEST.length - 1];
      return await fetchEntry(latest.date);
    }

    function navigateTo(date) {
      window.location.hash = date;
      if (window.innerWidth <= 768) {
        closeSidebar();
      }
    }

    function renderSummary(entry) {
      const main = document.getElementById('mainContent');
      const entryIndex = MANIFEST.findIndex(e => e.date === entry.date);
      const prevMeta = entryIndex > 0 ? MANIFEST[entryIndex - 1] : null;
      const nextMeta = entryIndex < MANIFEST.length - 1 ? MANIFEST[entryIndex + 1] : null;

      const themesHTML = entry.themes.map(t => `
        <div class="summary-theme">
          <div class="summary-theme-title">${t.title}</div>
          <p class="summary-theme-body">${t.summary}</p>
        </div>
      `).join('');

      const exercisesHTML = entry.exercises.map(ex => `
        <div class="summary-exercise">
          <div class="summary-exercise-meta">
            <span class="summary-exercise-num">${ex.number}</span>
            <span class="summary-exercise-tag">${ex.duration}</span>
            <span class="summary-exercise-tag">${ex.format}</span>
          </div>
          <div class="summary-exercise-title">${ex.title}</div>
          <p class="summary-exercise-desc">${ex.desc}</p>
          <p class="summary-exercise-outcome"><em>Outcome:</em> ${ex.outcome}</p>
        </div>
      `).join('');

      const prevNextHTML = `
        <nav class="entry-nav" aria-label="Entry navigation">
          ${prevMeta
            ? `<button class="entry-nav-side left" onclick="navigateTo('${prevMeta.date}')">
                <span class="entry-nav-arrow">
                  <svg viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
                    <polyline points="12,4 6,10 12,16"/>
                    <line x1="6" y1="10" x2="18" y2="10"/>
                  </svg>
                </span>
                <div class="entry-nav-meta">
                  <span class="entry-nav-date">${formatDate(prevMeta.date)}</span>
                  <span class="entry-nav-title">${truncateTitle(prevMeta.title)}</span>
                </div>
              </button>`
            : `<div class="entry-nav-side left hidden" aria-hidden="true"></div>`}
          <div class="entry-nav-divider"></div>
          ${nextMeta
            ? `<button class="entry-nav-side right" onclick="navigateTo('${nextMeta.date}')">
                <div class="entry-nav-meta">
                  <span class="entry-nav-date">${formatDate(nextMeta.date)}</span>
                  <span class="entry-nav-title">${truncateTitle(nextMeta.title)}</span>
                </div>
                <span class="entry-nav-arrow">
                  <svg viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
                    <polyline points="8,4 14,10 8,16"/>
                    <line x1="2" y1="10" x2="14" y2="10"/>
                  </svg>
                </span>
              </button>`
            : `<div class="entry-nav-side right disabled" aria-hidden="true">
                <div class="entry-nav-meta">
                  <span class="entry-nav-date" style="opacity:0.35">Up to date</span>
                </div>
              </div>`}
        </nav>`;

      main.innerHTML = `
        <div class="summary-wrap">
          <div class="summary-hero">
            <div class="summary-eyebrow">${entry.month}</div>
            <h1 class="summary-headline">${entry.title}</h1>
            <p class="summary-subtitle">${entry.subtitle}</p>
          </div>

          <div class="summary-section">
            <div class="summary-section-label">
              <span class="summary-section-num">\u2014</span>
              <span class="summary-section-heading">Themes of the Month</span>
            </div>
            <div class="summary-themes">${themesHTML}</div>
          </div>

          <div class="summary-section summary-section--exercises">
            <div class="summary-section-label">
              <span class="summary-section-num">\u2014</span>
              <span class="summary-section-heading">Design Exercises</span>
            </div>
            <p class="summary-exercises-intro">Three to five hands-on exercises to carry this month's thinking into your practice.</p>
            <div class="summary-exercises">${exercisesHTML}</div>
          </div>

          <div class="closing-quote visible">
            <div class="closing-quote-mark">&ldquo;</div>
            <p class="closing-quote-text">${entry.closingQuote.text}</p>
            <div class="closing-quote-rule"></div>
            <div class="closing-quote-attribution">${entry.closingQuote.attribution}</div>
            <div class="closing-quote-role">${entry.closingQuote.role}</div>
          </div>

          ${prevNextHTML}
        </div>
      `;

      document.title = `${entry.title} \u2014 Design Thinking`;
      updateSidebarActive(entry.date);
    }

    async function handleRouteChange() {
      const firstLoad = isFirstRender;
      isFirstRender = false;

      try {
        const entry = await getEntryFromHash();
        renderEntry(entry, firstLoad);
      } catch (err) {
        document.getElementById('mainContent').innerHTML =
          `<div class="loading-state">Failed to load entry. Please refresh.</div>`;
        console.error(err);
      }

      if (!firstLoad) {
        window.scrollTo({ top: 0, behavior: 'instant' });
      }
    }

    window.addEventListener('hashchange', () => handleRouteChange());

    // ═══════════════════════════════════════════════════════════════
    // SIDEBAR TOGGLE
    // ═══════════════════════════════════════════════════════════════

    let sidebarOpen = null;

    function setSidebarState(open) {
      sidebarOpen = open;
      const sidebar = document.getElementById('sidebar');
      const main = document.getElementById('mainContent');
      const backdrop = document.getElementById('sidebarBackdrop');
      const isDesktop = window.innerWidth > 768;

      if (open) {
        sidebar.classList.remove('closed');
        if (isDesktop) {
          main.classList.remove('sidebar-closed');
          backdrop.style.display = 'none';
        } else {
          backdrop.style.display = 'block';
          requestAnimationFrame(() => {
            backdrop.classList.add('visible');
          });
          document.body.style.overflow = 'hidden';
        }
      } else {
        sidebar.classList.add('closed');
        if (isDesktop) {
          main.classList.add('sidebar-closed');
        }
        if (!isDesktop) {
          backdrop.classList.remove('visible');
          setTimeout(() => {
            backdrop.style.display = 'none';
          }, 300);
          document.body.style.overflow = '';
        }
      }

      updateHamburgerIcon(open);
    }

    function toggleSidebar() {
      setSidebarState(!sidebarOpen);
    }

    function closeSidebar() {
      setSidebarState(false);
    }

    function updateHamburgerIcon(open) {
      const icon = document.getElementById('hamburgerIcon');
      if (open) {
        icon.innerHTML = `
          <line x1="3" y1="3" x2="15" y2="15"/>
          <line x1="15" y1="3" x2="3" y2="15"/>
        `;
      } else {
        icon.innerHTML = `
          <line x1="2" y1="4.5" x2="16" y2="4.5"/>
          <line x1="2" y1="9"   x2="16" y2="9"/>
          <line x1="2" y1="13.5" x2="16" y2="13.5"/>
        `;
      }
    }

    document.getElementById('hamburgerBtn').addEventListener('click', toggleSidebar);
    document.getElementById('sidebarBackdrop').addEventListener('click', closeSidebar);

    let resizeTimer;
    window.addEventListener('resize', () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => {
        const isDesktop = window.innerWidth > 768;
        const main = document.getElementById('mainContent');
        const backdrop = document.getElementById('sidebarBackdrop');
        const sidebar = document.getElementById('sidebar');

        if (isDesktop) {
          backdrop.style.display = 'none';
          backdrop.classList.remove('visible');
          document.body.style.overflow = '';
          if (sidebarOpen) {
            main.classList.remove('sidebar-closed');
            sidebar.classList.remove('closed');
          } else {
            main.classList.add('sidebar-closed');
            sidebar.classList.add('closed');
          }
        } else {
          main.classList.remove('sidebar-closed');
          if (sidebarOpen) {
            backdrop.style.display = 'block';
            requestAnimationFrame(() => backdrop.classList.add('visible'));
            document.body.style.overflow = 'hidden';
            sidebar.classList.remove('closed');
          } else {
            backdrop.style.display = 'none';
            backdrop.classList.remove('visible');
            document.body.style.overflow = '';
            sidebar.classList.add('closed');
          }
        }
      }, 100);
    });

    // ═══════════════════════════════════════════════════════════════
    // THEME TOGGLE
    // ═══════════════════════════════════════════════════════════════

    const html_el    = document.documentElement;
    const toggle     = document.getElementById('themeToggle');
    const iconSun    = document.getElementById('iconSun');
    const iconMoon   = document.getElementById('iconMoon');
    const label      = document.getElementById('themeLabel');
    const systemDark = window.matchMedia('(prefers-color-scheme: dark)');

    function isDark() {
      const t = html_el.dataset.theme;
      if (t === 'dark')  return true;
      if (t === 'light') return false;
      return systemDark.matches;
    }

    function applyTheme(dark, persist) {
      html_el.dataset.theme    = dark ? 'dark' : 'light';
      iconSun.style.display    = dark ? '' : 'none';
      iconMoon.style.display   = dark ? 'none' : '';
      label.textContent        = dark ? 'Light' : 'Dark';
      if (persist) {
        localStorage.setItem('theme', dark ? 'dark' : 'light');
      }
    }

    const savedTheme = localStorage.getItem('theme');
    if (savedTheme) {
      applyTheme(savedTheme === 'dark', false);
    } else {
      applyTheme(systemDark.matches, false);
    }

    toggle.addEventListener('click', () => applyTheme(!isDark(), true));
    systemDark.addEventListener('change', e => {
      if (!localStorage.getItem('theme')) {
        applyTheme(e.matches, false);
      }
    });

    // ═══════════════════════════════════════════════════════════════
    // INIT
    // ═══════════════════════════════════════════════════════════════

    const isDesktopInit = window.innerWidth > 768;
    setSidebarState(isDesktopInit);

    fetchManifest()
      .then(() => {
        buildSidebar();
        handleRouteChange();
      })
      .catch(err => {
        console.error('Failed to load manifest:', err);
        document.getElementById('mainContent').innerHTML =
          `<div class="loading-state">Could not load content. Please refresh.</div>`;
      });
  </script>
</body>
</html>
