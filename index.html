<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Joke Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ["Inter", "system-ui", "sans-serif"],
            },
            colors: {
              stage: {
                900: "#0f0b1a",
                800: "#1a1328",
                700: "#251c36",
                600: "#302544",
              },
              spotlight: {
                400: "#f5c542",
                500: "#e5a828",
                600: "#c98f1a",
              },
              neon: {
                pink: "#ff6b9d",
                purple: "#c084fc",
                blue: "#60a5fa",
              },
            },
          },
        },
      };
    </script>
    <style>
      body {
        background-color: #0f0b1a;
      }
      @keyframes fadeInUp {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      @keyframes shimmer {
        0% {
          background-position: -200% 0;
        }
        100% {
          background-position: 200% 0;
        }
      }
      @keyframes pulse-glow {
        0%,
        100% {
          box-shadow: 0 0 20px rgba(245, 197, 66, 0.15);
        }
        50% {
          box-shadow: 0 0 40px rgba(245, 197, 66, 0.3);
        }
      }
      @keyframes spotlight-sweep {
        0% {
          opacity: 0.03;
          transform: translateX(-50%) rotate(-5deg);
        }
        50% {
          opacity: 0.07;
          transform: translateX(0%) rotate(0deg);
        }
        100% {
          opacity: 0.03;
          transform: translateX(50%) rotate(5deg);
        }
      }
      .joke-card-enter {
        animation: fadeInUp 0.4s ease-out forwards;
      }
      .shimmer-loading {
        background: linear-gradient(
          90deg,
          #251c36 25%,
          #302544 50%,
          #251c36 75%
        );
        background-size: 200% 100%;
        animation: shimmer 1.5s infinite;
      }
      .spotlight-bg {
        animation: spotlight-sweep 8s ease-in-out infinite alternate;
      }
      .input-glow:focus {
        animation: pulse-glow 2s ease-in-out infinite;
      }
    </style>
  </head>
  <body class="font-sans text-white min-h-screen">
    <div id="root"></div>
    <script type="text/babel">
      const { useState, useRef, useCallback } = React;

      const ANTHROPIC_SYSTEM_PROMPT = `You are a world-class comedy writer specializing in observational humor, in the style of Jerry Seinfeld, John Mulaney, and Nate Bargatze. Your job is to write brilliant, clean jokes about a given topic.

Rules:
- Write between 5 and 10 jokes
- Every joke must be CLEAN and family-friendly. No profanity, no shock humor, no crude or sexual content.
- Focus on observational comedy: find the absurdity in everyday things, clever wordplay, and smart setups with satisfying punchlines.
- Mix formats: some one-liners, some short setup-punchline jokes, and some brief observational bits (2-3 sentences max).
- Be witty and intelligent. Reward the audience for thinking.
- Avoid hacky, groan-worthy puns or generic dad jokes. If you use a pun, it must be genuinely clever.
- Each joke should feel like it could be part of a stand-up set — natural, conversational, with good rhythm.
- Do NOT repeat the same structural pattern for every joke. Vary the format and approach.

Output format:
Return ONLY a JSON array of strings, where each string is one joke. No markdown, no commentary, no numbering inside the strings. Example:
["First joke here.", "Second joke here. With a punchline.", "Third joke."]`;

      function MicrophoneIcon({ className }) {
        return (
          <svg
            className={className}
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            strokeWidth="1.5"
            strokeLinecap="round"
            strokeLinejoin="round"
          >
            <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z" />
            <path d="M19 10v2a7 7 0 0 1-14 0v-2" />
            <line x1="12" y1="19" x2="12" y2="23" />
            <line x1="8" y1="23" x2="16" y2="23" />
          </svg>
        );
      }

      function CopyIcon({ className }) {
        return (
          <svg
            className={className}
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            strokeWidth="2"
            strokeLinecap="round"
            strokeLinejoin="round"
          >
            <rect x="9" y="9" width="13" height="13" rx="2" ry="2" />
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" />
          </svg>
        );
      }

      function CheckIcon({ className }) {
        return (
          <svg
            className={className}
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            strokeWidth="2"
            strokeLinecap="round"
            strokeLinejoin="round"
          >
            <polyline points="20 6 9 17 4 12" />
          </svg>
        );
      }

      function SparkleIcon({ className }) {
        return (
          <svg className={className} viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 0L14.59 8.41L23 11L14.59 13.59L12 22L9.41 13.59L1 11L9.41 8.41L12 0Z" />
          </svg>
        );
      }

      function JokeCard({ joke, index, total }) {
        const [copied, setCopied] = useState(false);

        const handleCopy = useCallback(() => {
          navigator.clipboard.writeText(joke).then(() => {
            setCopied(true);
            setTimeout(() => setCopied(false), 2000);
          });
        }, [joke]);

        return (
          <div
            className="joke-card-enter group relative"
            style={{ animationDelay: `${index * 80}ms`, opacity: 0 }}
          >
            <div className="relative bg-gradient-to-br from-stage-700/80 to-stage-800/80 backdrop-blur-sm border border-white/[0.06] rounded-2xl p-6 hover:border-spotlight-400/20 transition-all duration-300 hover:shadow-lg hover:shadow-spotlight-400/5">
              <div className="flex items-start gap-4">
                <span className="flex-shrink-0 w-8 h-8 rounded-full bg-spotlight-400/10 text-spotlight-400 flex items-center justify-center text-sm font-semibold border border-spotlight-400/20">
                  {index + 1}
                </span>
                <p className="flex-1 text-gray-200 leading-relaxed text-[15px] pt-1">
                  {joke}
                </p>
                <button
                  onClick={handleCopy}
                  className="flex-shrink-0 p-2 rounded-lg text-gray-500 hover:text-spotlight-400 hover:bg-spotlight-400/10 transition-all duration-200 opacity-0 group-hover:opacity-100"
                  title="Copy joke"
                >
                  {copied ? (
                    <CheckIcon className="w-4 h-4 text-green-400" />
                  ) : (
                    <CopyIcon className="w-4 h-4" />
                  )}
                </button>
              </div>
            </div>
          </div>
        );
      }

      function LoadingSkeleton() {
        const messages = [
          "Writing material\u2026",
          "Workshopping punchlines\u2026",
          "Timing the delivery\u2026",
          "Rehearsing in the mirror\u2026",
          "Reading the room\u2026",
        ];
        const [msgIndex, setMsgIndex] = useState(0);

        React.useEffect(() => {
          const interval = setInterval(() => {
            setMsgIndex((i) => (i + 1) % messages.length);
          }, 2200);
          return () => clearInterval(interval);
        }, []);

        return (
          <div className="space-y-4 mt-10">
            <div className="flex items-center justify-center gap-3 mb-8">
              <div className="relative">
                <MicrophoneIcon className="w-6 h-6 text-spotlight-400 animate-bounce" />
              </div>
              <p className="text-spotlight-400 font-medium text-lg">
                {messages[msgIndex]}
              </p>
            </div>
            {[...Array(5)].map((_, i) => (
              <div
                key={i}
                className="shimmer-loading rounded-2xl h-24"
                style={{ animationDelay: `${i * 200}ms` }}
              />
            ))}
          </div>
        );
      }

      function ApiKeyModal({ onSubmit }) {
        const [key, setKey] = useState("");

        return (
          <div className="fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center z-50 p-4">
            <div className="bg-stage-700 border border-white/10 rounded-2xl p-8 max-w-md w-full shadow-2xl">
              <h2 className="text-xl font-bold text-white mb-2">
                API Key Required
              </h2>
              <p className="text-gray-400 text-sm mb-6">
                Enter your Anthropic API key to generate jokes. Your key stays
                in your browser and is never stored on any server.
              </p>
              <input
                type="password"
                value={key}
                onChange={(e) => setKey(e.target.value)}
                placeholder="sk-ant-..."
                className="w-full bg-stage-900 border border-white/10 rounded-xl px-4 py-3 text-white placeholder-gray-500 focus:outline-none focus:border-spotlight-400/50 mb-4 text-sm"
                onKeyDown={(e) => {
                  if (e.key === "Enter" && key.trim()) onSubmit(key.trim());
                }}
              />
              <button
                onClick={() => key.trim() && onSubmit(key.trim())}
                disabled={!key.trim()}
                className="w-full bg-spotlight-400 hover:bg-spotlight-500 disabled:opacity-40 disabled:cursor-not-allowed text-stage-900 font-semibold py-3 rounded-xl transition-colors"
              >
                Save & Continue
              </button>
            </div>
          </div>
        );
      }

      function App() {
        const [apiKey, setApiKey] = useState(
          () => localStorage.getItem("anthropic_api_key") || ""
        );
        const [topic, setTopic] = useState("");
        const [jokes, setJokes] = useState([]);
        const [loading, setLoading] = useState(false);
        const [error, setError] = useState("");
        const [lastTopic, setLastTopic] = useState("");
        const [showKeyModal, setShowKeyModal] = useState(!apiKey);
        const inputRef = useRef(null);
        const resultsRef = useRef(null);

        const handleApiKey = useCallback((key) => {
          setApiKey(key);
          localStorage.setItem("anthropic_api_key", key);
          setShowKeyModal(false);
        }, []);

        const generateJokes = useCallback(
          async (subject) => {
            if (!subject.trim() || !apiKey) return;

            setLoading(true);
            setError("");
            setJokes([]);
            setLastTopic(subject.trim());

            try {
              const response = await fetch(
                "https://api.anthropic.com/v1/messages",
                {
                  method: "POST",
                  headers: {
                    "Content-Type": "application/json",
                    "x-api-key": apiKey,
                    "anthropic-version": "2023-06-01",
                    "anthropic-dangerous-direct-browser-access": "true",
                  },
                  body: JSON.stringify({
                    model: "claude-sonnet-4-20250514",
                    max_tokens: 1500,
                    system: ANTHROPIC_SYSTEM_PROMPT,
                    messages: [
                      {
                        role: "user",
                        content: `Write jokes about: ${subject.trim()}`,
                      },
                    ],
                  }),
                }
              );

              if (!response.ok) {
                const errBody = await response.json().catch(() => null);
                if (response.status === 401) {
                  localStorage.removeItem("anthropic_api_key");
                  setApiKey("");
                  setShowKeyModal(true);
                  throw new Error(
                    "Invalid API key. Please enter a valid key."
                  );
                }
                throw new Error(
                  errBody?.error?.message ||
                    `API error (${response.status})`
                );
              }

              const data = await response.json();
              const text = data.content?.[0]?.text || "";

              const jsonMatch = text.match(/\[[\s\S]*\]/);
              if (!jsonMatch) {
                throw new Error("Unexpected response format.");
              }

              const parsed = JSON.parse(jsonMatch[0]);
              if (!Array.isArray(parsed) || parsed.length === 0) {
                throw new Error("No jokes were generated. Try again!");
              }

              setJokes(parsed);

              setTimeout(() => {
                resultsRef.current?.scrollIntoView({
                  behavior: "smooth",
                  block: "start",
                });
              }, 100);
            } catch (err) {
              setError(err.message || "Something went wrong. Please try again.");
            } finally {
              setLoading(false);
            }
          },
          [apiKey]
        );

        const handleSubmit = useCallback(
          (e) => {
            e.preventDefault();
            generateJokes(topic);
          },
          [topic, generateJokes]
        );

        const handleReset = useCallback(() => {
          setTopic("");
          setJokes([]);
          setError("");
          setLastTopic("");
          inputRef.current?.focus();
        }, []);

        const handleRegenerate = useCallback(() => {
          generateJokes(lastTopic);
        }, [lastTopic, generateJokes]);

        const suggestions = [
          "Airports",
          "Dating apps",
          "Working from home",
          "Cats vs Dogs",
          "Spreadsheets",
          "Grocery stores",
        ];

        return (
          <div className="min-h-screen relative overflow-hidden">
            {/* Background effects */}
            <div className="fixed inset-0 pointer-events-none">
              <div
                className="spotlight-bg absolute top-0 left-1/2 w-[800px] h-[600px] bg-gradient-to-b from-spotlight-400/5 to-transparent"
                style={{
                  clipPath: "polygon(40% 0%, 60% 0%, 80% 100%, 20% 100%)",
                }}
              />
              <div className="absolute top-0 left-0 w-full h-full bg-[radial-gradient(ellipse_at_top,_rgba(192,132,252,0.04)_0%,_transparent_60%)]" />
            </div>

            {showKeyModal && <ApiKeyModal onSubmit={handleApiKey} />}

            <div className="relative z-10 max-w-3xl mx-auto px-4 py-12 sm:py-20">
              {/* Header */}
              <header className="text-center mb-12">
                <div className="inline-flex items-center gap-3 mb-6">
                  <div className="p-3 rounded-2xl bg-spotlight-400/10 border border-spotlight-400/20">
                    <MicrophoneIcon className="w-8 h-8 text-spotlight-400" />
                  </div>
                </div>
                <h1 className="text-4xl sm:text-5xl font-extrabold tracking-tight mb-3">
                  <span className="bg-gradient-to-r from-white via-gray-100 to-gray-300 bg-clip-text text-transparent">
                    Joke Generator
                  </span>
                </h1>
                <p className="text-gray-400 text-lg max-w-md mx-auto">
                  Enter any topic and get instant observational comedy, powered
                  by AI.
                </p>
              </header>

              {/* Input Form */}
              <form onSubmit={handleSubmit} className="mb-6">
                <div className="relative">
                  <input
                    ref={inputRef}
                    type="text"
                    value={topic}
                    onChange={(e) => setTopic(e.target.value)}
                    placeholder='Try "airports" or "online shopping"'
                    disabled={loading}
                    className="input-glow w-full bg-stage-700/60 backdrop-blur border border-white/[0.08] rounded-2xl pl-5 pr-44 py-5 text-white text-lg placeholder-gray-500 focus:outline-none focus:border-spotlight-400/40 transition-all duration-300 disabled:opacity-50"
                  />
                  <button
                    type="submit"
                    disabled={loading || !topic.trim()}
                    className="absolute right-2 top-1/2 -translate-y-1/2 bg-gradient-to-r from-spotlight-400 to-spotlight-500 hover:from-spotlight-500 hover:to-spotlight-600 disabled:from-gray-600 disabled:to-gray-700 disabled:cursor-not-allowed text-stage-900 font-bold px-6 py-3 rounded-xl transition-all duration-200 flex items-center gap-2 text-sm"
                  >
                    Make Me Laugh
                    <span className="text-base">🎤</span>
                  </button>
                </div>
              </form>

              {/* Suggestion chips */}
              {!jokes.length && !loading && (
                <div className="flex flex-wrap justify-center gap-2 mb-10">
                  {suggestions.map((s) => (
                    <button
                      key={s}
                      onClick={() => {
                        setTopic(s);
                        generateJokes(s);
                      }}
                      className="px-4 py-2 rounded-full bg-stage-700/50 border border-white/[0.06] text-gray-400 text-sm hover:text-spotlight-400 hover:border-spotlight-400/30 hover:bg-spotlight-400/5 transition-all duration-200"
                    >
                      {s}
                    </button>
                  ))}
                </div>
              )}

              {/* Error */}
              {error && (
                <div className="bg-red-500/10 border border-red-500/20 rounded-2xl p-4 mb-6 text-center">
                  <p className="text-red-400 text-sm">{error}</p>
                  <button
                    onClick={() => setError("")}
                    className="text-red-400/60 hover:text-red-400 text-xs mt-2 underline"
                  >
                    Dismiss
                  </button>
                </div>
              )}

              {/* Loading */}
              {loading && <LoadingSkeleton />}

              {/* Results */}
              {jokes.length > 0 && !loading && (
                <div ref={resultsRef}>
                  <div className="flex items-center justify-between mb-6">
                    <div className="flex items-center gap-2">
                      <SparkleIcon className="w-4 h-4 text-spotlight-400" />
                      <h2 className="text-lg font-semibold text-white">
                        Jokes about{" "}
                        <span className="text-spotlight-400">
                          {lastTopic}
                        </span>
                      </h2>
                    </div>
                    <span className="text-gray-500 text-sm">
                      {jokes.length} jokes
                    </span>
                  </div>

                  <div className="space-y-3">
                    {jokes.map((joke, i) => (
                      <JokeCard
                        key={`${lastTopic}-${i}`}
                        joke={joke}
                        index={i}
                        total={jokes.length}
                      />
                    ))}
                  </div>

                  {/* Action buttons */}
                  <div className="flex flex-col sm:flex-row items-center justify-center gap-3 mt-10">
                    <button
                      onClick={handleRegenerate}
                      className="w-full sm:w-auto px-6 py-3 rounded-xl bg-stage-700/60 border border-white/[0.08] text-white font-medium hover:border-spotlight-400/30 hover:text-spotlight-400 transition-all duration-200 flex items-center justify-center gap-2"
                    >
                      <svg
                        className="w-4 h-4"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        strokeWidth="2"
                        strokeLinecap="round"
                        strokeLinejoin="round"
                      >
                        <polyline points="23 4 23 10 17 10" />
                        <polyline points="1 20 1 14 7 14" />
                        <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15" />
                      </svg>
                      Fresh Material
                    </button>
                    <button
                      onClick={handleReset}
                      className="w-full sm:w-auto px-6 py-3 rounded-xl bg-stage-700/60 border border-white/[0.08] text-gray-400 font-medium hover:border-white/20 hover:text-white transition-all duration-200"
                    >
                      Try Another Topic
                    </button>
                  </div>
                </div>
              )}

              {/* Footer */}
              <footer className="text-center mt-20 text-gray-600 text-xs">
                <p>
                  Powered by Claude &middot; Observational comedy on demand
                </p>
                {apiKey && (
                  <button
                    onClick={() => setShowKeyModal(true)}
                    className="text-gray-600 hover:text-gray-400 underline mt-1"
                  >
                    Change API key
                  </button>
                )}
              </footer>
            </div>
          </div>
        );
      }

      const root = ReactDOM.createRoot(document.getElementById("root"));
      root.render(<App />);
    </script>
  </body>
</html>
